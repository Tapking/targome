<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#08111f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta
    name="description"
    content="مترجم فارسی و انگلیسی مخصوص گوشی"
  >

  <title>ترجمان | مترجم فارسی و انگلیسی</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="app">

  <!-- Header -->
  <header class="topbar">

    <div>
      <div class="logo">🌐 ترجمان</div>
      <div class="subtitle">
        مترجم فارسی ↔ English
      </div>
    </div>

    <button
      id="themeBtn"
      class="icon-btn"
      type="button"
      aria-label="تغییر حالت نمایش"
    >
      🌙
    </button>

  </header>


  <!-- Translator -->
  <section class="translator-card">

    <!-- Languages -->
    <div class="language-row">

      <label class="language-box">
        <span>زبان ورودی</span>

        <select id="sourceLang">
          <option value="auto">🔎 تشخیص خودکار</option>
          <option value="fa">🇮🇷 فارسی</option>
          <option value="en">🇬🇧 English</option>
        </select>
      </label>


      <button
        id="swapBtn"
        class="swap-btn"
        type="button"
        aria-label="جابه‌جایی زبان‌ها"
      >
        ⇄
      </button>


      <label class="language-box">
        <span>زبان ترجمه</span>

        <select id="targetLang">
          <option value="en">🇬🇧 English</option>
          <option value="fa">🇮🇷 فارسی</option>
        </select>
      </label>

    </div>


    <!-- Text Areas -->
    <div class="text-grid">

      <!-- Input -->
      <section class="text-panel">

        <div class="panel-head">
          <span>متن ورودی</span>
          <span id="sourceCount">0 / 5000</span>
        </div>


        <textarea
          id="sourceText"
          maxlength="5000"
          placeholder="متن خود را وارد کنید..."
          autocomplete="off"
          autocorrect="on"
          spellcheck="true"
        ></textarea>


        <div class="panel-actions">

          <button
            id="pasteBtn"
            class="secondary-btn"
            type="button"
          >
            📋 چسباندن
          </button>

          <button
            id="clearBtn"
            class="secondary-btn"
            type="button"
          >
            🗑️ پاک کردن
          </button>

          <button
            id="speakSourceBtn"
            class="secondary-btn"
            type="button"
          >
            🔊 پخش
          </button>

        </div>

      </section>


      <!-- Result -->
      <section class="text-panel result-panel">

        <div class="panel-head">
          <span>ترجمه</span>
          <span id="targetCount">0</span>
        </div>


        <div
          id="resultText"
          class="result-text placeholder"
          dir="auto"
          aria-live="polite"
        >
          ترجمه اینجا نمایش داده می‌شود.
        </div>


        <div class="panel-actions">

          <button
            id="copyBtn"
            class="secondary-btn"
            type="button"
          >
            📋 کپی
          </button>

          <button
            id="shareBtn"
            class="secondary-btn"
            type="button"
          >
            ↗️ اشتراک
          </button>

          <button
            id="speakTargetBtn"
            class="secondary-btn"
            type="button"
          >
            🔊 پخش
          </button>

          <button
            id="favoriteBtn"
            class="secondary-btn"
            type="button"
          >
            ☆ ذخیره
          </button>

        </div>

      </section>

    </div>


    <!-- Translate -->
    <div class="main-actions">

      <button
        id="translateBtn"
        class="translate-btn"
        type="button"
      >
        🌐 ترجمه کن
      </button>

    </div>


    <!-- Status -->
    <div
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    ></div>

  </section>


  <!-- History -->
  <section class="history-card">

    <div class="section-head">

      <h2>🕘 تاریخچه</h2>

      <button
        id="clearHistoryBtn"
        class="text-btn"
        type="button"
      >
        پاک کردن همه
      </button>

    </div>


    <div class="search-history">

      <input
        id="historySearch"
        type="search"
        placeholder="🔎 جستجو در تاریخچه..."
        autocomplete="off"
      >

    </div>


    <div
      id="historyList"
      class="history-list"
    ></div>


    <div
      id="emptyHistory"
      class="empty"
    >
      هنوز ترجمه‌ای ذخیره نشده است.
    </div>

  </section>


  <!-- Settings -->
  <section class="settings-card">

    <div class="section-head">
      <h2>⚙️ تنظیمات</h2>
    </div>

    <div class="settings-grid">

      <button
        id="exportBtn"
        class="setting-btn"
        type="button"
      >
        📥 خروجی تاریخچه
      </button>

      <button
        id="resetBtn"
        class="setting-btn danger"
        type="button"
      >
        ♻️ بازنشانی برنامه
      </button>

    </div>

  </section>


  <footer>
    برای ترجمه واقعی اتصال اینترنت لازم است.
  </footer>

</main>


<script src="app.js"></script>

</body>
</html>
