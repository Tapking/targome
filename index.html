
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">
    <title>مترجم هوشمند</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header class="header">
        <div class="logo">🌐</div>
        <div>
            <h1>مترجم هوشمند</h1>
            <p>ترجمه سریع بین زبان‌های مختلف</p>
        </div>
    </header>

    <main class="translator">

        <div class="language-bar">
            <div class="language-box">
                <label for="sourceLang">زبان مبدأ</label>
                <select id="sourceLang">
                    <option value="fa">فارسی 🇮🇷</option>
                    <option value="en">انگلیسی 🇬🇧</option>
                    <option value="tr">ترکی استانبولی 🇹🇷</option>
                    <option value="ar">عربی 🇸🇦</option>
                    <option value="auto">تشخیص خودکار</option>
                </select>
            </div>

            <button id="swapBtn" class="swap" title="جابه‌جایی زبان‌ها">⇄</button>

            <div class="language-box">
                <label for="targetLang">زبان مقصد</label>
                <select id="targetLang">
                    <option value="en">انگلیسی 🇬🇧</option>
                    <option value="fa">فارسی 🇮🇷</option>
                    <option value="tr">ترکی استانبولی 🇹🇷</option>
                    <option value="ar">عربی 🇸🇦</option>
                </select>
            </div>
        </div>

        <div class="text-area">
            <div class="area-header">
                <span>متن ورودی</span>
                <button id="clearBtn" class="icon-btn">پاک کردن ✕</button>
            </div>

            <textarea id="sourceText"
                placeholder="متن خود را اینجا بنویسید..."
                maxlength="5000"></textarea>

            <div class="area-footer">
                <span id="charCount">۰ / ۵۰۰۰</span>
                <button id="pasteBtn" class="small-btn">چسباندن</button>
            </div>
        </div>

        <button id="translateBtn" class="translate-btn">
            <span>ترجمه کن</span>
            <span>✦</span>
        </button>

        <div class="text-area result-area">
            <div class="area-header">
                <span>نتیجه ترجمه</span>
                <span id="resultLanguage">انگلیسی</span>
            </div>

            <div id="resultText" class="result-text">
                ترجمه شما اینجا نمایش داده می‌شود...
            </div>

            <div class="area-footer">
                <span id="resultStatus">آماده ترجمه</span>
                <div class="result-actions">
                    <button id="copyBtn" class="small-btn">کپی 📋</button>
                    <button id="speakBtn" class="small-btn">پخش صدا 🔊</button>
                </div>
            </div>
        </div>

        <div id="message" class="message"></div>

    </main>

    <footer>
        <p>مترجم هوشمند | پشتیبانی از فارسی، انگلیسی، ترکی و عربی</p>
    </footer>

</div>

<script src="app.js"></script>
</body>
</html>
